name: Docker

on:
  schedule:
    # Rebuild nightly so base-image security updates get picked up. Offset
    # from the other repos' jobs rather than sharing a minute with them.
    - cron: '20 5 * * *'
  push:
    branches: ["master", "claude/**", "fix/**", "feat/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["master"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE: krippler52/doom

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # write so the release-on-merge path can create a git tag
      packages: write
      id-token: write
    env:
      # Docker Hub is optional here: GHCR needs no secret, so a fork or a
      # fresh clone still publishes without anyone setting anything up.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    outputs:
      release_version: ${{ steps.detect.outputs.version }}
      is_release_merge: ${{ steps.detect.outputs.is_release_merge }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags so the detect step can see whether a vX.Y.Z
          # tag already exists for the version that landed.
          fetch-depth: 0
          fetch-tags: true

      # ── Release-on-merge detection ─────────────────────────────────────────
      # A release PR flips CHANGELOG.md's top section from "[Unreleased]" to
      # "[X.Y.Z] — DATE". Detecting that here means a plain merge publishes
      # only `edge`, while a release-PR merge publishes the version pins and
      # `latest` and creates the tag and GitHub Release in the same run.
      - name: Detect release-on-merge
        id: detect
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          TOP="$(awk '/^## \[/ {print; exit}' CHANGELOG.md || true)"
          echo "top: ${TOP}"
          VER="$(printf '%s' "$TOP" | sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p')"
          if [ -z "$VER" ]; then
            echo "Top CHANGELOG section is not a release header — skipping auto-release."
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v${VER}" >/dev/null; then
            echo "Tag v${VER} already exists — skipping auto-release."
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Release commit detected: v${VER}"
          echo "is_release_merge=true"        >> "$GITHUB_OUTPUT"
          echo "version=${VER}"               >> "$GITHUB_OUTPUT"
          echo "major=${VER%%.*}"             >> "$GITHUB_OUTPUT"
          echo "major_minor=${VER%.*}"        >> "$GITHUB_OUTPUT"

      - name: Work out which registries this run can push to
        id: registries
        run: |
          set -euo pipefail
          {
            echo "images<<IMAGES_EOF"
            echo "${REGISTRY}/${IMAGE_NAME,,}"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              echo "${DOCKERHUB_IMAGE}"
            else
              echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — publishing to GHCR only." >&2
            fi
            echo "IMAGES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into Docker Hub
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ steps.registries.outputs.images }}
          # Tagging policy:
          #   • push tag v1.10.0          → 1.10.0, 1.10, 1, latest  (manual flow)
          #   • release-PR merge to master → same, plus edge
          #   • plain merge to master      → edge
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=${{ steps.detect.outputs.version }},enable=${{ steps.detect.outputs.is_release_merge == 'true' }}
            type=raw,value=${{ steps.detect.outputs.major_minor }},enable=${{ steps.detect.outputs.is_release_merge == 'true' }}
            type=raw,value=${{ steps.detect.outputs.major }},enable=${{ steps.detect.outputs.is_release_merge == 'true' }}
            type=raw,value=latest,enable=${{ steps.detect.outputs.is_release_merge == 'true' }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      # A release-PR merge that published the version pins also gets stamped
      # with vX.Y.Z, so the version is marked in git history and the Release
      # below has a tag to hang off. The default GITHUB_TOKEN can push a tag
      # but will not re-trigger this workflow, which is deliberate.
      - name: Auto-create vX.Y.Z git tag
        if: steps.detect.outputs.is_release_merge == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

  # Create or update the GitHub Release from the matching CHANGELOG section,
  # for either path: a manual tag push, or a release-PR merge.
  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || needs.build.outputs.is_release_merge == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$RELEASE_VERSION"
            TAG="v${VERSION}"
          fi
          REPO_LC="${GITHUB_REPOSITORY,,}"

          SECTION="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md | sed "/./,\$!d")"

          {
            if [ -n "$SECTION" ]; then
              printf '%s\n' "$SECTION"
            else
              echo "Release ${TAG}."
            fi
            echo ""
            echo "### Docker image"
            echo '```bash'
            echo "docker pull ghcr.io/${REPO_LC}:${VERSION}"
            echo '```'
            echo "Also published as \`latest\`, \`${VERSION%.*}\`, and \`${VERSION%%.*}\`."
            echo ""
            echo "Game data is not included. Supply an IWAD; see DOCKER.md."
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "${GITHUB_SHA}"
          fi
