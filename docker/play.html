<!DOCTYPE html>
<!--
  A noVNC client that captures the mouse.

  Stock noVNC is a remote desktop client: it reports where the pointer is,
  in absolute screen coordinates. That is the wrong shape for a game. The
  pointer walks to an edge of the 320x200 screen and stops, taking mouse
  look with it, and the real cursor wanders out of the browser window.

  This page uses the Pointer Lock API instead, which hides the cursor,
  confines it to the canvas and reports relative movement. Each movement is
  sent as the centre of the screen plus the delta; the engine warps the
  pointer back to the centre after every motion, so what it measures is the
  delta and nothing else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOOM</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #c0c0c0;
    font: 14px/1.5 system-ui, sans-serif;
    overflow: hidden;
  }
  #screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* The engine renders one fixed size. The canvas is scaled up to fill the
     window, by the same factor in both directions so the picture keeps its
     shape -- the black bars are whatever is left over on the other axis. */
  #screen canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.72);
    text-align: center;
    padding: 24px;
    cursor: pointer;
  }
  #overlay[hidden] { display: none; }
  #overlay h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 0.2em;
    color: #b33;
  }
  #overlay p { margin: 0; max-width: 34em; }
  #overlay .dim { color: #808080; font-size: 13px; }
  #status {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 6px 10px;
    background: rgba(0, 0, 0, 0.8);
    font-size: 13px;
  }
  #status[hidden] { display: none; }
</style>
</head>
<body>
<div id="screen"></div>

<div id="overlay">
  <h1>DOOM</h1>
  <p>Click to play. The game goes fullscreen and takes the mouse, so it will
     not slide out of the window while you turn.</p>
  <p class="dim" id="esc-note">Keys and the mouse are configured in game under
     Options → Setup.</p>
</div>

<div id="status" hidden></div>

<script type="module">
import RFB from './core/rfb.js';

const screenEl  = document.getElementById('screen');
const overlayEl = document.getElementById('overlay');
const statusEl  = document.getElementById('status');

function status(text) {
  statusEl.textContent = text;
  statusEl.hidden = !text;
}

const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
const rfb = new RFB(screenEl, `${scheme}://${location.host}`, {
  wsProtocols: ['binary'],
});

// The engine has one fixed resolution; never rescale it to the window.
window.__rfb = rfb;   // for automated checks; harmless otherwise
rfb.scaleViewport = false;
rfb.clipViewport  = false;
rfb.focusOnClick  = true;

rfb.addEventListener('connect', () => {
  status('');
  overlayEl.hidden = false;
  fitCanvas();
  rfb.focus();
});

rfb.addEventListener('disconnect', (e) => {
  overlayEl.hidden = true;
  status(e.detail.clean ? 'Disconnected.' : 'Connection lost. Reload to try again.');
});

rfb.addEventListener('securityfailure', (e) => {
  status(`Authentication failed: ${e.detail.reason || 'unknown reason'}`);
});

rfb.addEventListener('credentialsrequired', () => {
  const password = prompt('VNC password:');
  if (password !== null) rfb.sendCredentials({ password });
});

//
// Integer scaling.
//
// noVNC sizes its canvas to the framebuffer. Scale it up by whole numbers
// with CSS so a 320x200 picture stays 320x200 pixels, each one square.
//
function canvas() {
  return screenEl.querySelector('canvas');
}

function fitCanvas() {
  const c = canvas();
  if (!c || !c.width || !c.height) return;

  // The smaller of the two ratios, so the picture fits in both directions;
  // applying it to both axes is what keeps it from being stretched. Whole
  // numbers were sharper but wasted most of a large screen -- a 640x400
  // picture on a 2560x1440 display could only manage 3x.
  const scale = Math.min(window.innerWidth  / c.width,
                         window.innerHeight / c.height);

  c.style.width  = `${Math.round(c.width  * scale)}px`;
  c.style.height = `${Math.round(c.height * scale)}px`;
}

// Fullscreen resizes the window after the event, so refit on both.
document.addEventListener('fullscreenchange', fitCanvas);

window.addEventListener('resize', fitCanvas);

//
// Pointer capture.
//
// While locked the cursor does not exist and mousemove reports movementX and
// movementY instead of a position. Those go out as centre + delta.
//
let buttons = 0;

// Movement seen since the last thing actually sent.
let pendingX = 0;
let pendingY = 0;
let flushQueued = false;

function locked() {
  return document.pointerLockElement === canvas();
}

function sendMouse(dx, dy) {
  const c = canvas();
  if (!c) return;
  // _sendMouse is noVNC's internal pointer path. There is no public
  // equivalent in this version; if a future noVNC renames it, the page
  // falls back to being an ordinary viewer rather than breaking.
  if (typeof rfb._sendMouse !== 'function') return;

  // The offset has to land inside the framebuffer, so a movement bigger than
  // half the screen cannot be expressed in one report. Send as much as fits
  // and keep the rest for the next one, rather than dropping it: a fast flick
  // should turn further, not mysteriously turn less.
  const cx = Math.round(c.width / 2);
  const cy = Math.round(c.height / 2);
  const limX = cx - 1;
  const limY = cy - 1;

  const useX = Math.max(-limX, Math.min(limX, dx));
  const useY = Math.max(-limY, Math.min(limY, dy));

  pendingX = dx - useX;
  pendingY = dy - useY;

  rfb._sendMouse(cx + useX, cy + useY, buttons);
}

//
// One report per frame, not one per mouse event.
//
// A gaming mouse reports several hundred times a second. Sending each one
// straight out floods the VNC link with pointer events, and the button state
// rides along on those same events -- so a release could sit behind a queue of
// movement, or be coalesced away, and the game would keep firing. Batching the
// movement into one report per frame keeps the link quiet, and button changes
// are sent immediately and on their own.
//
function flushMouse() {
  flushQueued = false;
  if (!locked()) return;
  if (pendingX === 0 && pendingY === 0) return;

  const dx = pendingX;
  const dy = pendingY;
  pendingX = 0;
  pendingY = 0;
  sendMouse(dx, dy);

  // sendMouse may have left a remainder from a very fast flick.
  if (pendingX !== 0 || pendingY !== 0) queueFlush();
}

function queueFlush() {
  if (flushQueued) return;
  flushQueued = true;
  requestAnimationFrame(flushMouse);
}

// A button change on its own, at the centre, leaving pending movement alone.
function sendButtons() {
  const c = canvas();
  if (!c || typeof rfb._sendMouse !== 'function') return;
  rfb._sendMouse(Math.round(c.width / 2), Math.round(c.height / 2), buttons);
}

// Let go of everything. Losing the capture with a button held would otherwise
// leave the game holding it down for ever -- firing, in DOOM's case.
function releaseButtons() {
  if (buttons === 0) return;
  buttons = 0;
  pendingX = 0;
  pendingY = 0;
  const c = canvas();
  if (c && typeof rfb._sendMouse === 'function') {
    rfb._sendMouse(Math.round(c.width / 2), Math.round(c.height / 2), 0);
  }
}

//
// Escape belongs to the game, not to the browser.
//
// Pointer Lock hands Escape to the browser: it cancels the capture, and the
// game never sees the key it uses for its own menu. The Keyboard Lock API
// exists for exactly this and gives Escape back to the page -- but only while
// the document is fullscreen, so going fullscreen is part of starting play.
// Holding Escape still leaves, which is the browser's guaranteed way out and
// cannot be taken away.
//
let keyboardLocked = false;

async function enterPlay() {
  const c = canvas();
  if (!c) return;

  try {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    }
  } catch (e) {
    // Fullscreen refused. Everything below still works; Escape just goes back
    // to being the browser's.
  }

  try {
    if (navigator.keyboard && navigator.keyboard.lock) {
      await navigator.keyboard.lock(['Escape']);
      keyboardLocked = true;
    }
  } catch (e) {
    keyboardLocked = false;
  }

  if (c.requestPointerLock) c.requestPointerLock();
  rfb.focus();
  updateEscNote();
}

function updateEscNote() {
  const note = document.getElementById('esc-note');
  if (!note) return;
  note.textContent = keyboardLocked
    ? 'Esc opens the game menu. Hold Esc to release the mouse and leave fullscreen.'
    : 'This browser will not let the page keep Esc, so Esc releases the mouse —'
      + ' press it again for the game menu. Options → Setup → Controls can put'
      + ' the menu on a second key.';
}

overlayEl.addEventListener('click', enterPlay);

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock();
    keyboardLocked = false;
    updateEscNote();
  }
});

document.addEventListener('pointerlockchange', () => {
  overlayEl.hidden = locked();
  if (locked()) rfb.focus();
  else releaseButtons();
});

// A button held while the window goes away is the other way to get stuck.
window.addEventListener('blur', releaseButtons);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) releaseButtons();
});

document.addEventListener('pointerlockerror', () => {
  status('The browser would not capture the mouse; playing without capture.');
});

// Capture phase on the window, so these run before noVNC's own handlers on
// the canvas and can stop them sending absolute positions that are frozen
// while the pointer is locked.
window.addEventListener('mousemove', (e) => {
  if (!locked()) return;
  e.stopPropagation();
  pendingX += e.movementX || 0;
  pendingY += e.movementY || 0;
  queueFlush();
}, true);

window.addEventListener('mousedown', (e) => {
  if (!locked()) return;
  e.stopPropagation();
  e.preventDefault();
  buttons |= 1 << e.button;
  // Send the movement that is already waiting, then the press on its own, so
  // it cannot sit behind a frame's worth of queued motion.
  flushMouse();
  sendButtons();
}, true);

window.addEventListener('mouseup', (e) => {
  if (!locked()) return;
  e.stopPropagation();
  e.preventDefault();
  buttons &= ~(1 << e.button);
  flushMouse();
  sendButtons();
}, true);

window.addEventListener('contextmenu', (e) => {
  if (locked()) e.preventDefault();
});

status('Connecting…');
</script>
</body>
</html>
