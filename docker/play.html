<!DOCTYPE html>
<!--
  A noVNC client that captures the mouse.

  Stock noVNC is a remote desktop client: it reports where the pointer is,
  in absolute screen coordinates. That is the wrong shape for a game. The
  pointer walks to an edge of the 320x200 screen and stops, taking mouse
  look with it, and the real cursor wanders out of the browser window.

  This page uses the Pointer Lock API instead, which hides the cursor,
  confines it to the canvas and reports relative movement. Each movement is
  sent as the centre of the screen plus the delta; the engine warps the
  pointer back to the centre after every motion, so what it measures is the
  delta and nothing else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOOM</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #c0c0c0;
    font: 14px/1.5 system-ui, sans-serif;
    overflow: hidden;
  }
  #screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* The engine renders one fixed size. The canvas is scaled up to fill the
     window, by the same factor in both directions so the picture keeps its
     shape -- the black bars are whatever is left over on the other axis.

     Set here with !important rather than as an inline style, because noVNC
     writes its own width and height onto the canvas whenever the framebuffer
     is resized and would otherwise win: an inline style beats a stylesheet
     rule, but not an important one. */
  #screen canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width:  var(--fb-w, auto) !important;
    height: var(--fb-h, auto) !important;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.72);
    text-align: center;
    padding: 24px;
    cursor: pointer;
  }
  #overlay[hidden] { display: none; }
  #overlay h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 0.2em;
    color: #b33;
  }
  #overlay p { margin: 0; max-width: 34em; }
  #overlay .dim { color: #808080; font-size: 13px; }
  #overlay #build-note { color: #555; font-size: 11px; letter-spacing: 0.08em; }
  #overlay kbd { font: inherit; color: #d0d0d0; border: 1px solid #555;
                 border-radius: 3px; padding: 0 4px; }
  #choices {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  #choices button {
    font: inherit;
    color: #d8d8d8;
    background: #1a1a1a;
    border: 1px solid #4a4a4a;
    border-radius: 4px;
    padding: 9px 18px;
    cursor: pointer;
  }
  #choices button:hover { background: #262626; border-color: #b33; }
  #choices button:focus-visible { outline: 2px solid #b33; outline-offset: 2px; }
  #play-fullscreen { border-color: #b33; }
  #status {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 6px 10px;
    background: rgba(0, 0, 0, 0.8);
    font-size: 13px;
  }
  #status[hidden] { display: none; }
</style>
</head>
<body>
<div id="screen"></div>

<div id="overlay">
  <h1>DOOM</h1>
  <p>The mouse is captured either way, so it cannot slide out of the picture
     while you turn. Sound plays in this tab.</p>
  <div id="choices">
    <button id="play-fullscreen" type="button">Play fullscreen</button>
    <button id="play-windowed" type="button">Play in this window</button>
  </div>
  <p class="dim" id="esc-note">The <kbd>`</kbd> key opens the game menu. Keys and
     the mouse are configured there, under Options → Setup.</p>
  <p class="dim" id="audio-note">Sound: not started.</p>
  <p class="dim" id="video-note">Picture: not started.</p>
  <p class="dim" id="build-note">__DOOM_VERSION__</p>
</div>

<div id="status" hidden></div>

<!-- The ring buffer that both audio paths use. An ordinary script, not a
     module: the worklet loads this same file into its own global scope. -->
<script src="doom-ring.js"></script>

<script type="module">
import RFB from './core/rfb.js';

const screenEl  = document.getElementById('screen');
const overlayEl = document.getElementById('overlay');
const statusEl  = document.getElementById('status');

// Two things report through this line -- the mouse capture and the sound --
// and either can have something to say while the other does not, so each gets
// its own slot rather than overwriting the other's message.
let statusMain = '';
let statusAudio = '';

function renderStatus() {
  const text = [statusMain, statusAudio].filter(Boolean).join(' ');
  statusEl.textContent = text;
  statusEl.hidden = !text;
}

function status(text) {
  statusMain = text;
  renderStatus();
}

function audioStatus(text) {
  statusAudio = text;
  renderStatus();
}

const scheme = location.protocol === 'https:' ? 'wss' : 'ws';

//
// Count what the picture actually costs, by wrapping WebSocket for the one
// moment noVNC creates its own.
//
// The frames-painted figure alone cannot tell a picture that is not being sent
// from one that is being sent and not arriving. A container reporting a steady
// 35 frames a second to a page painting 11 means two thirds of them are going
// nowhere, and the number of bytes per second says whether that is the link
// or something before it.
//
let videoBytes = 0;
let videoRateKB = 0;
let videoPlayBytes = 0;     // ... and over the whole spell of play, which is
let videoPlayMs = 0;        //     what the note reports
let videoPlayKB = 0;

//
// Both streams are counted, because the interesting question is what the sound
// was doing while the picture was not arriving.
//
// The picture and the sound are separate connections to the same proxy over
// the same link. If the picture stops for half a second and the sound keeps
// coming, the link and the proxy are fine and it is x11vnc that went quiet. If
// they stop together, it is the link or the proxy. Nothing else distinguishes
// those two, and they need completely different answers.
//
let audioBytes = 0;
let audioWorstGap = 0;        // longest the sound went without a message, ms

(function countBytes() {
  const Native = window.WebSocket;
  let audioLast = 0;

  window.WebSocket = function (...a) {
    const sock = new Native(...a);
    const isAudio = String(a[0]).indexOf('token=audio') >= 0;
    sock.addEventListener('message', (e) => {
      const n = (e.data && e.data.byteLength) || 0;

      if (!isAudio) { videoBytes += n; return; }

      audioBytes += n;

      //
      // How long the sound went quiet, not how much of it eventually turned
      // up. Counting bytes over the window was the first attempt and it is
      // wrong: when a stall ends, the backlog arrives in a burst, so the
      // volume comes out right and the stall is invisible. Freezing the whole
      // container -- which stops both streams by definition -- was reported as
      // "the picture alone went quiet". Only the timing shows it.
      //
      const now = performance.now();

      if (audioLast && now - audioLast > audioWorstGap)
        audioWorstGap = now - audioLast;

      audioLast = now;
    });
    return sock;
  };
  window.WebSocket.prototype = Native.prototype;
  Object.assign(window.WebSocket, Native);

  window.__audioGapReset = () => { audioLast = 0; };
})();

const rfb = new RFB(screenEl, `${scheme}://${location.host}`, {
  wsProtocols: ['binary'],
});

// The engine has one fixed resolution; never rescale it to the window.
window.__rfb = rfb;   // for automated checks; harmless otherwise
rfb.scaleViewport = false;
rfb.clipViewport  = false;
rfb.focusOnClick  = true;

rfb.addEventListener('connect', () => {
  status('');
  overlayEl.hidden = false;
  fitCanvas();
  rfb.focus();
});

rfb.addEventListener('disconnect', (e) => {
  overlayEl.hidden = true;
  status(e.detail.clean ? 'Disconnected.' : 'Connection lost. Reload to try again.');
});

rfb.addEventListener('securityfailure', (e) => {
  status(`Authentication failed: ${e.detail.reason || 'unknown reason'}`);
});

rfb.addEventListener('credentialsrequired', () => {
  const password = prompt('VNC password:');
  if (password !== null) rfb.sendCredentials({ password });
});

//
// Integer scaling.
//
// noVNC sizes its canvas to the framebuffer. Scale it up by whole numbers
// with CSS so a 320x200 picture stays 320x200 pixels, each one square.
//
function canvas() {
  return screenEl.querySelector('canvas');
}

function fitCanvas() {
  const c = canvas();
  if (!c || !c.width || !c.height) return;

  // The smaller of the two ratios, so the picture fits in both directions;
  // applying it to both axes is what keeps it from being stretched. Whole
  // numbers were sharper but wasted most of a large screen -- a 640x400
  // picture on a 2560x1440 display could only manage 3x.
  const scale = Math.min(window.innerWidth  / c.width,
                         window.innerHeight / c.height);

  document.documentElement.style.setProperty(
    '--fb-w', `${Math.round(c.width  * scale)}px`);
  document.documentElement.style.setProperty(
    '--fb-h', `${Math.round(c.height * scale)}px`);
}

// Fullscreen resizes the window after the event, so refit on both.
document.addEventListener('fullscreenchange', fitCanvas);

// The framebuffer size is not known when the connection opens; noVNC sets the
// canvas dimensions once the server has said how big it is, and resizes it
// again if that ever changes. Refit whenever it does, or the picture keeps
// whatever size it happened to have when we first looked.
const fbObserver = new MutationObserver(fitCanvas);

function watchCanvas() {
  const c = canvas();
  if (!c) return false;
  fbObserver.observe(c, { attributes: true, attributeFilter: ['width', 'height'] });
  fitCanvas();
  return true;
}

if (!watchCanvas()) {
  const waitForCanvas = setInterval(() => {
    if (watchCanvas()) clearInterval(waitForCanvas);
  }, 100);
}

window.addEventListener('resize', fitCanvas);

//
// Pointer capture.
//
// While locked the cursor does not exist and mousemove reports movementX and
// movementY instead of a position. Those go out as centre + delta.
//
let buttons = 0;

// Movement seen since the last thing actually sent.
let pendingX = 0;
let pendingY = 0;
let flushQueued = false;

// Where the remote pointer currently is. Reports walk this around the screen
// rather than always naming centre-plus-delta: a steady drag has a steady
// delta, so that named the same coordinates over and over, and x11vnc drops a
// pointer report that does not move the pointer. Most of the movement never
// reached X at all, which is what the jitter was.
let vx = 0;
let vy = 0;

function locked() {
  return document.pointerLockElement === canvas();
}

function centreOf(c) {
  return [Math.round(c.width / 2), Math.round(c.height / 2)];
}

function resetPointer() {
  const c = canvas();
  if (!c) return;
  [vx, vy] = centreOf(c);
  pendingX = 0;
  pendingY = 0;
}

//
// One report per frame, not one per mouse event.
//
// A gaming mouse reports several hundred times a second. Sending each one
// straight out floods the VNC link, and the button state rides on those same
// reports -- so a release could sit behind a queue of movement. Batching the
// movement into one report per frame keeps the link quiet, and button changes
// go out immediately and on their own.
//
function flushMouse() {
  flushQueued = false;
  if (!locked()) return;
  if (pendingX === 0 && pendingY === 0) return;

  const c = canvas();
  if (!c || typeof rfb._sendMouse !== 'function') return;

  const [cx, cy] = centreOf(c);
  const edgeX = cx - 4;
  const edgeY = cy - 4;

  let dx = pendingX;
  let dy = pendingY;
  pendingX = 0;
  pendingY = 0;

  // Walking off the screen would clamp, and clamping silently eats movement.
  // Put the pointer back in the middle first: a report landing exactly on the
  // centre is the one the engine ignores, so it costs no turn and simply
  // re-bases where the next delta is measured from.
  if (vx + dx < cx - edgeX || vx + dx > cx + edgeX ||
      vy + dy < cy - edgeY || vy + dy > cy + edgeY) {
    rfb._sendMouse(cx, cy, buttons);
    vx = cx;
    vy = cy;
  }

  // Whatever still will not fit is kept for the next frame rather than lost,
  // so a fast flick turns further instead of mysteriously turning less.
  const nx = Math.max(0, Math.min(c.width  - 1, vx + dx));
  const ny = Math.max(0, Math.min(c.height - 1, vy + dy));
  pendingX = (vx + dx) - nx;
  pendingY = (vy + dy) - ny;

  if (nx !== vx || ny !== vy) {
    vx = nx;
    vy = ny;
    rfb._sendMouse(vx, vy, buttons);
  }

  if (pendingX !== 0 || pendingY !== 0) queueFlush();
}

function queueFlush() {
  if (flushQueued) return;
  flushQueued = true;
  requestAnimationFrame(flushMouse);
}

// A button change on its own. Sent at the centre, which the engine ignores for
// movement, so pressing fire cannot also nudge the view.
function sendButtons() {
  const c = canvas();
  if (!c || typeof rfb._sendMouse !== 'function') return;
  const [cx, cy] = centreOf(c);
  vx = cx;
  vy = cy;
  rfb._sendMouse(cx, cy, buttons);
}

// Let go of everything. Losing the capture with a button held would otherwise
// leave the game holding it down for ever -- firing, in DOOM's case.
function releaseButtons() {
  if (buttons === 0) return;
  buttons = 0;
  sendButtons();
}

//
// Sound.
//
// VNC carries a picture and nothing else, so the game's audio arrives on a
// second WebSocket to the same port: raw signed 16 bit stereo, mixed in the
// container by audiostream, with a short header saying at what rate.
//
// It is played through an AudioWorklet rather than a stream of scheduled
// buffers. The container sends at a steady real-time rate and this machine
// consumes at its own, which are never quite the same; a worklet with a ring
// buffer in front of it can absorb that -- pad a little when it runs dry,
// drop a little when it runs long -- where a queue of scheduled buffers
// would drift until it either stuttered or fell behind.
//
const AUDIO_MAGIC = 'DOOMAUD1';

// How much sound to keep ahead of the speakers. Enough to ride out a network
// hiccup, little enough that a gunshot is not late: this is added to what the
// pipes in the container already hold.
// What the ring buffer starts with and what it will grow to if that turns out
// not to be enough. Every millisecond here is a millisecond between pulling
// the trigger and hearing it, so it starts small and earns more only when it
// actually runs dry -- see doom-ring.js.
const AUDIO_TARGET_MS     = 25;
const AUDIO_MAX_TARGET_MS = 250;
const AUDIO_MAX_MS        = 400;

// The fallback runs on the main thread, alongside noVNC decoding and blitting
// every frame the game draws. Its own buffer is the bigger cost: a
// ScriptProcessorNode is handed to the page roughly two buffers ahead of when
// it is heard, so 4096 frames was about 190 ms of delay on its own, and 1024
// is a quarter of that.
//
// 512 was tried and is worse, not better: it halves that 46 ms but leaves the
// main thread 11 ms a callback next to noVNC's decoding, and on a busy
// machine the ring buffer answers the underruns by growing its target to
// 125 ms -- giving back twice what the smaller buffer saved.
const AUDIO_FALLBACK_TARGET_MS = 25;
const AUDIO_FALLBACK_BUFFER    = 1024;


let audioCtx = null;
let audioSocket = null;
let audioNode = null;
let audioPush = null;
let audioRing = null;      // the fallback's, for the note; the worklet has its own
let audioWanted = true;
let audioFrames = 0;
let audioSrcRate = 0;
let audioWatchdog = null;
let audioVia = '';

// For automated checks; harmless otherwise, like __rfb above.
window.__audio = () => ({
  build: '__DOOM_VERSION__',
  secure: window.isSecureContext,
  via: audioVia,
  state: audioCtx ? audioCtx.state : 'none',
  rate: audioCtx ? audioCtx.sampleRate : 0,
  srcRate: audioSrcRate,
  node: !!audioNode,
  frames: audioFrames,
  heldMs: audioRing ? Math.round(audioRing.heldMs()) : null,
  targetMs: audioRing ? Math.round(audioRing.target * 1000 / audioRing.srcRate) : null,
  underruns: audioRing ? audioRing.underruns : null,
  reason: audioReason,
});

// Sound that does not arrive used to arrive as nothing at all: no message, no
// way to tell a container sending silence from a page that never connected.
// Whatever goes wrong now says so, once, in the status line.
let audioComplained = false;
let audioReason = '';

function audioFailed(why) {
  if (audioComplained) return;
  audioComplained = true;
  audioReason = why;
  audioStatus('No sound: ' + why + ' The game is unaffected; the picture and '
            + 'the controls do not depend on it.');
  audioNote();
}

//
// What the sound is actually doing, on the page rather than in a console.
//
// Twice now a silent game has been indistinguishable from a broken one from
// the outside: the container's log is identical either way, and everything
// that decides whether sound arrives happens in the browser. This says which,
// where the overlay already is -- press Esc or ` and it is on screen.
//
const audioNoteEl = document.getElementById('audio-note');

function audioNote() {
  if (!audioNoteEl) return;

  let text;

  if (audioComplained)
    text = 'Sound: ' + audioReason;
  else if (!audioCtx)
    text = 'Sound: not started — click to play.';
  else if (!audioNode)
    text = 'Sound: connecting…';
  else
    text = `Sound: on — ${audioSrcRate} Hz in, ${Math.round(audioCtx.sampleRate)}`
         + ` Hz out, ${(audioFrames / (audioSrcRate || 1)).toFixed(1)} s received`
         + (audioRing ? `, holding ${Math.round(audioRing.heldMs())} ms` : '')
         + (audioRing && audioRing.underruns
              ? ` (grown from ${Math.round(audioRing.minTarget*1000/audioRing.srcRate)}`
                + ` after ${audioRing.underruns} underrun`
                + (audioRing.underruns === 1 ? ')' : 's)')
              : '')
         + (audioVia === 'worklet' ? '' : ', via the fallback')
         + (audioCtx.state === 'running' ? '.' : `, context ${audioCtx.state}.`);

  audioNoteEl.textContent = text;
}

setInterval(audioNote, 500);


//
// The same argument for the picture.
//
// The engine can report a healthy 35 frames a second while the browser paints
// far fewer: VNC only sends what changed, websockify relays it in Python, and
// the tab has to decode and draw it. Nothing in the container can see the far
// end of that, so the page counts what it actually painted -- by watching the
// canvas change, which is the one measure that cannot be fooled by a frame
// that was sent and never arrived.
//
// The engine's own figure is in the container log. Together they say which
// half of the path a stutter is in, which took an afternoon of guessing the
// first time.
//
const videoNoteEl = document.getElementById('video-note');

let videoPainted = 0;         // canvas changes seen in the current second
let videoRate = 0;            // ... and in the last full second
let videoBest = 0;            // the best second lately, which is the real test
let videoWorstGap = 0;        // longest wait between two of them, ms
let videoLate = 0;            // paints that took over a tic and a quarter
let videoBusy = false;        // was the last second one where anything moved?
let videoStalls = 0;          // times the browser's own frame loop went away
let videoWorstStall = 0;      // ... and for how long, ms
const VIDEO_TIC_MS = 1000 / 35;

// VNC sends what changed and nothing else, so a player standing still paints
// nothing and every figure here reads as a catastrophe -- 1 frame a second,
// worst wait 1467 ms -- when the truth is that nothing moved. The first
// version of this said exactly that, and it is the same mistake that made an
// earlier test harness report its own robot standing still as a 200 ms stall.
// So: gaps are only counted while the picture is actually changing, and a
// still screen is reported as a still screen.
const VIDEO_BUSY_RATE = 10;

(function watchPicture() {
  const screenEl = document.getElementById('screen');
  const probe = document.createElement('canvas');
  probe.width = 48;
  probe.height = 30;
  const g = probe.getContext('2d', { willReadFrequently: true });

  let last = 0, prev = null, secondStart = 0, lastTick = 0;

  function frame(now) {
    //
    // How late this callback itself was.
    //
    // Everything the page does happens on one thread: noVNC decoding the
    // picture, the sound when it is running through the fallback rather than a
    // worklet, and this probe. If that thread is busy, frames that arrived
    // perfectly well never reach the screen -- and from the container's side
    // that is indistinguishable from frames that never arrived. It is the last
    // link in the chain with nothing measuring it.
    //
    // The browser aims for one of these every 16 ms; 50 is late enough to mean
    // something held the thread.
    //
    if (lastTick && now - lastTick > 50) {
      videoStalls++;
      if (now - lastTick > videoWorstStall) videoWorstStall = now - lastTick;
    }
    lastTick = now;

    const cv = screenEl && screenEl.querySelector('canvas');

    // Nothing counts while the overlay is up. It covers the picture, so the
    // canvas stops changing and every figure below would record the reader
    // looking at them as the worst stutter of the session -- which is exactly
    // what the first version of this did.
    if (overlayEl && !overlayEl.hidden) {
      last = 0;
      prev = null;
      secondStart = 0;
      lastTick = 0;
      requestAnimationFrame(frame);
      return;
    }

    if (cv && cv.width) {
      try {
        g.drawImage(cv, 0, 0, probe.width, probe.height);
        const d = g.getImageData(0, 0, probe.width, probe.height).data;
        let sum = 0;
        for (let i = 0; i < d.length; i += 4) sum += d[i] * 3 + d[i+1] * 5 + d[i+2];

        if (prev !== null && sum !== prev) {
          if (last && videoBusy) {
            const gap = now - last;
            if (gap > videoWorstGap) videoWorstGap = gap;
            if (gap > VIDEO_TIC_MS * 1.25) videoLate++;
          }
          last = now;
          videoPainted++;
        }
        prev = sum;
      } catch (e) {
        // A canvas that is not ready to be read is not worth a message.
      }
    }

    if (!secondStart) secondStart = now;
    else if (now - secondStart >= 1000) {
      videoRate = videoPainted * 1000 / (now - secondStart);
      videoBusy = videoRate >= VIDEO_BUSY_RATE;
      if (videoRate > videoBest) videoBest = videoRate;
      videoRateKB = videoBytes / 1024 * 1000 / (now - secondStart);
      videoPlayBytes += videoBytes;
      videoPlayMs += now - secondStart;
      videoPlayKB = videoPlayBytes / 1024 * 1000 / Math.max(1, videoPlayMs);
      videoBytes = 0;
      videoPainted = 0;
      secondStart = now;
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();

function videoNote() {
  if (!videoNoteEl) return;

  if (!videoBest) {
    videoNoteEl.textContent = 'Picture: nothing measured yet — play for a few'
                            + ' seconds, then press Esc.';
    return;
  }

  //
  // These figures describe the last spell of play, and they hold.
  //
  // They used to age out on a timer that kept running while this screen was
  // up -- and this screen can only be read when you have stopped playing, so
  // what you read was whatever had survived being wiped, measured against a
  // motionless picture. That is how a quarter-size run came back reporting 8
  // frames a second and sent me chasing bandwidth that was never the problem.
  // They are cleared when play starts again instead, so what is on screen is
  // always the run you just did.
  //
  videoNoteEl.textContent =
    `Picture, while you were playing: best ${videoBest.toFixed(0)} frames a`
    + ` second of the 35 the game draws`
    + `, arriving at ${videoPlayKB.toFixed(0)} KB/s`
    + (videoWorstGap
         ? `, longest gap ${Math.round(videoWorstGap)} ms, ${videoLate} late`
         : '')
    + '.'
    + (videoStalls
         ? ` This browser's own drawing stopped ${videoStalls} times, worst`
           + ` ${Math.round(videoWorstStall)} ms — frames that arrive during`
           + ` one of those are never painted.`
         : '')
    + (videoWorstGap
         ? ` The sound, over the same link, went quiet for at most`
           + ` ${Math.round(audioWorstGap)} ms.`
           //
           // Only worth a conclusion when there is a real stall to explain.
           // Below that the two figures are both just the ordinary lumpiness
           // of two streams through one proxy, and comparing them said "both
           // stopped together" about a perfectly healthy 83 ms gap.
           //
           + (videoWorstGap > 200
                ? (audioWorstGap > videoWorstGap * 0.5
                     ? ' Both stopped together, so it is the link or the proxy,'
                       + ' not the picture.'
                     : ' The sound kept coming through the gap, so the link and'
                       + ' the proxy were working and the picture alone went'
                       + ' quiet.')
                : '')
         : '');
}

setInterval(videoNote, 500);

// Cleared when play starts, so every figure describes one spell of play.
function videoReset() {
  videoBest = 0;
  videoStalls = 0;
  videoWorstStall = 0;
  audioWorstGap = 0;
  if (window.__audioGapReset) window.__audioGapReset();
  videoWorstGap = 0;
  videoLate = 0;
  videoPlayBytes = 0;
  videoPlayMs = 0;
  videoPlayKB = 0;
  videoBytes = 0;
}

window.__video = () => ({
  painted: videoRate,
  best: videoBest,
  kbPerSec: Math.round(videoRateKB),
  playKB: Math.round(videoPlayKB),
  busy: videoBusy,
  worstGapMs: Math.round(videoWorstGap),
  late: videoLate,
  stalls: videoStalls,
  worstStallMs: Math.round(videoWorstStall),
  audioWorstGapMs: Math.round(audioWorstGap),
});

function audioURL() {
  return `${scheme}://${location.host}/websockify?token=audio`;
}

//
// Called from the click that starts play: an AudioContext created without a
// gesture behind it starts suspended and stays that way.
//
async function startAudio() {
  if (!audioWanted || audioCtx) return;

  if (!window.AudioContext || !window.AudioWorkletNode) {
    audioFailed('this browser has no Web Audio.');
    return;
  }

  if (!window.DoomRing) {
    audioFailed('doom-ring.js did not load.');
    return;
  }

  let ctx;

  try {
    ctx = new AudioContext({ latencyHint: 'interactive' });
  } catch (e) {
    audioFailed('the browser would not start an audio context.');
    return;
  }

  audioCtx = ctx;

  // AudioWorklet is the better of the two -- it runs on the audio thread,
  // where nothing the page is doing can interrupt it -- but it is gated on a
  // secure context, and this page is normally served over plain HTTP from a
  // machine on the network. `ctx.audioWorklet` is simply absent there, while
  // the AudioWorkletNode constructor is present, which is what made the first
  // attempt at this look supported right up until it threw.
  //
  // So where there is no worklet the sound goes through a ScriptProcessorNode
  // instead: deprecated for years, implemented everywhere, and needing no
  // secure context. Both feed the same DoomRing.
  if (ctx.audioWorklet && typeof ctx.audioWorklet.addModule === 'function') {
    try {
      await ctx.audioWorklet.addModule('doom-ring.js');
      await ctx.audioWorklet.addModule('doom-audio.js');
      audioVia = 'worklet';
    } catch (e) {
      audioVia = '';
    }
  }

  if (!audioVia) {
    if (typeof ctx.createScriptProcessor !== 'function') {
      audioFailed('this browser offers no way to play a stream of audio.');
      return;
    }
    audioVia = 'fallback';
  }

  let sock;

  try {
    sock = new WebSocket(audioURL(), 'binary');
  } catch (e) {
    audioFailed('the audio connection could not be opened.');
    return;
  }

  sock.binaryType = 'arraybuffer';
  audioSocket = sock;

  // Nothing below reports a stream that connects and then says nothing --
  // a container built before the sound existed, or one told to send its audio
  // to PulseAudio instead -- so time it.
  audioWatchdog = setTimeout(() => {
    if (!audioFrames)
      audioFailed('the container is not sending any. Check its log for a '
                + '"sound:" line, and that PULSE_SERVER is unset.');
  }, 4000);

  // A WebSocket message is whatever came out of the socket, which is not the
  // same as whatever went in: the header can arrive split and a message can
  // end in the middle of a frame. Anything left over waits here for the rest
  // of itself, because dropping a stray byte would swap the two channels for
  // the remainder of the session.
  let carry = new Uint8Array(0);
  let haveHeader = false;

  sock.onmessage = (e) => {
    const chunk = new Uint8Array(e.data);
    let bytes;

    if (carry.length) {
      bytes = new Uint8Array(carry.length + chunk.length);
      bytes.set(carry, 0);
      bytes.set(chunk, carry.length);
    } else {
      bytes = chunk;
    }

    let off = 0;

    if (!haveHeader) {
      if (bytes.length - off < 16) { carry = bytes.slice(off); return; }

      let magic = '';
      for (let i = 0; i < 8; i++) magic += String.fromCharCode(bytes[off + i]);

      if (magic !== AUDIO_MAGIC) {
        audioFailed('what arrived on the audio connection was not sound.');
        sock.close();
        return;
      }

      const srcRate = bytes[off+8] | (bytes[off+9] << 8)
                    | (bytes[off+10] << 16) | (bytes[off+11] << 24);
      off += 16;
      haveHeader = true;
      audioSrcRate = srcRate;

      try {
        if (audioVia === 'worklet') {
          audioNode = new AudioWorkletNode(ctx, 'doom-audio', {
            outputChannelCount: [2],
            processorOptions: {
              srcRate,
              targetMs: AUDIO_TARGET_MS,
              maxTargetMs: AUDIO_MAX_TARGET_MS,
              maxMs: AUDIO_MAX_MS,
            },
          });

          audioPush = (f) => audioNode.port.postMessage(f, [f.buffer]);
        } else {
          const ring = new DoomRing(srcRate, ctx.sampleRate,
                                    AUDIO_FALLBACK_TARGET_MS,
                                    AUDIO_MAX_TARGET_MS, AUDIO_MAX_MS);
          audioRing = ring;

          // One input channel, not none: a node with no inputs at all is not
          // pulled by every implementation, and this one is never connected
          // to anything, so what it reads is silence either way.
          audioNode = ctx.createScriptProcessor(AUDIO_FALLBACK_BUFFER, 1, 2);

          audioNode.onaudioprocess = (e) => {
            const out = e.outputBuffer;
            ring.read(out.getChannelData(0), out.getChannelData(1));
          };

          audioPush = (f) => ring.push(f);
        }
      } catch (err) {
        audioFailed('the browser would not start playback (' + err + ').');
        sock.close();
        return;
      }

      audioNode.connect(ctx.destination);
    }

    // Whole frames only: two channels of 16 bits each.
    const whole = (bytes.length - off) & ~3;
    carry = bytes.slice(off + whole);

    if (!whole || !audioNode) return;

    const view = new DataView(bytes.buffer, bytes.byteOffset + off, whole);
    const f = new Float32Array(whole >> 1);

    for (let i = 0; i < f.length; i++) f[i] = view.getInt16(i * 2, true) / 32768;

    if (!audioFrames && audioWatchdog) {
      clearTimeout(audioWatchdog);
      audioWatchdog = null;
      audioComplained = false;
      audioReason = '';
      audioStatus('');
    }

    audioFrames += whole >> 2;
    audioPush(f);
  };

  sock.onclose = () => {
    audioSocket = null;
    if (!audioFrames)
      audioFailed('the container refused the audio connection. It is probably '
                + 'older than the sound support -- pull the current image.');
  };

  sock.onerror = () => {
    if (!audioFrames)
      audioFailed('the audio connection failed.');
  };

  // Autoplay policy: a context made inside a click is running, but one made
  // just before the page was interacted with is not.
  if (ctx.state === 'suspended') {
    ctx.resume().catch(() => {});

    // resume() is a promise, and a browser that refuses it does so quietly.
    setTimeout(() => {
      if (audioCtx && audioCtx.state === 'suspended')
        audioFailed('the browser is holding the sound until you interact with '
                  + 'the page. Click the picture.');
    }, 1500);
  }
}

function stopAudio() {
  if (audioWatchdog) { clearTimeout(audioWatchdog); audioWatchdog = null; }
  if (audioSocket) { audioSocket.close(); audioSocket = null; }
  if (audioNode)   {
    audioNode.onaudioprocess = null;   // no-op on a worklet node
    audioNode.disconnect();
    audioNode = null;
  }
  audioPush = null;
  audioRing = null;
  if (audioCtx)    { audioCtx.close().catch(() => {}); audioCtx = null; }
}

window.addEventListener('pagehide', stopAudio);

//
// Escape belongs to the browser: it releases the mouse and brings this screen
// back, in both modes and in every browser.
//
// It used to be taken from the browser with the Keyboard Lock API, because
// Escape was the game's own menu key and Pointer Lock hands Escape to the
// browser. That reasoning stopped being true in 1.10.14, when the menu moved
// to ` -- but the lock stayed, and with it a way out that behaved differently
// depending on whether you had started fullscreen and whether the browser
// granted the lock at all. Keyboard Lock needs a secure context, so the same
// container answered Esc one way over HTTPS and another over plain HTTP on a
// LAN, which is not something anyone should have to know.
//
// So: ` opens the game menu, Esc gets you out. Nothing to explain.
//

// Which way play was last started, so clicking the picture after Esc resumes
// the same way rather than surprising anyone with fullscreen.
let wantFullscreen = true;

function enterPlay(fullscreen) {
  const c = canvas();
  if (!c) return;

  wantFullscreen = fullscreen;

  // Both requests go out inside the click, before anything is awaited.
  //
  // Awaiting fullscreen first and asking for the pointer afterwards spends
  // the click's user activation on the way, and the browser then refuses the
  // pointer lock -- silently. That left the game running with an ordinary
  // remote-desktop pointer while the engine recentred underneath it, which is
  // the worst of both and jitters.
  if (c.requestPointerLock) c.requestPointerLock();

  // Inside the click too: this is the user activation that lets sound play.
  startAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

  let fs = Promise.resolve();
  if (fullscreen && !document.fullscreenElement
      && document.documentElement.requestFullscreen) {
    try {
      fs = document.documentElement.requestFullscreen({ navigationUI: 'hide' })
             || Promise.resolve();
    } catch (e) {
      fs = Promise.reject(e);
    }
  }

  // Fullscreen may be refused -- an iframe without permission, or a browser
  // that says no -- and it is playable either way.
  fs.then(fitCanvas).catch(() => {});

  rfb.focus();
  fitCanvas();
  updateEscNote();

  // Nothing reports a refused pointer lock reliably, so check.
  setTimeout(() => {
    if (!locked()) {
      status('The browser did not capture the mouse. Click the picture to try '
           + 'again. Until it does, turn GRAB POINTER off under Options → '
           + 'Setup → Mouse, or the view will jump about.');
    } else {
      status('');
    }
  }, 700);
}

function updateEscNote() {
  const note = document.getElementById('esc-note');
  if (!note) return;
  note.textContent =
    'Esc releases the mouse and brings this screen back. Press ` for the game'
    + ' menu — Options → Setup → Controls moves it to another key.';
}

document.getElementById('play-fullscreen')
  .addEventListener('click', () => enterPlay(true));
document.getElementById('play-windowed')
  .addEventListener('click', () => enterPlay(false));

// Clicking the picture after the capture is released resumes however play was
// started, so Escape then click does not drop anyone into fullscreen.
screenEl.addEventListener('click', () => {
  if (!locked()) enterPlay(wantFullscreen);
});

document.addEventListener('fullscreenchange', fitCanvas);

//
// Esc, handled here rather than left to the browser.
//
// Releasing the mouse on Esc was the browser's own behaviour, and the page
// only watched for the result. That works until it does not: a browser that
// keeps the key, a client that swallows it, a fullscreen that eats the first
// press. Two releases have now gone by with Esc still not bringing this screen
// back for somebody, and every one of them was a guess about what the browser
// would do. So the page does it itself, in the capture phase before noVNC sees
// the key, and asks for the same thing the browser would have: drop the
// pointer, leave fullscreen.
//
// The browser's own handling still runs; both arriving at the same end is
// harmless, since exitPointerLock on an already-released pointer does nothing.
//
window.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' && e.keyCode !== 27) return;
  if (!locked() && !document.fullscreenElement) return;

  // The game's menu is on `, so Esc is not the game's to handle.
  e.preventDefault();
  e.stopPropagation();

  try { if (document.exitPointerLock) document.exitPointerLock(); } catch (err) {}
  try { if (document.fullscreenElement && document.exitFullscreen)
          document.exitFullscreen(); } catch (err) {}

  // Belt and braces: if neither of those produced an event -- which is the
  // failure this exists for -- show the screen anyway.
  setTimeout(() => { if (!locked()) overlayEl.hidden = false; }, 150);
}, true);

document.addEventListener('pointerlockchange', () => {
  overlayEl.hidden = locked();
  if (locked()) {
    videoReset();
    resetPointer();
    rfb.focus();
  } else {
    releaseButtons();
  }
  // Pointer lock resolves after enterPlay returns, so the note is only
  // correct once we know whether it actually took.
  updateEscNote();
});

// A button held while the window goes away is the other way to get stuck.
window.addEventListener('blur', releaseButtons);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) releaseButtons();
});

document.addEventListener('pointerlockerror', () => {
  status('The browser would not capture the mouse; playing without capture.');
});

// Capture phase on the window, so these run before noVNC's own handlers on
// the canvas and can stop them sending absolute positions that are frozen
// while the pointer is locked.
window.addEventListener('mousemove', (e) => {
  if (!locked()) return;
  e.stopPropagation();
  pendingX += e.movementX || 0;
  pendingY += e.movementY || 0;
  queueFlush();
}, true);

window.addEventListener('mousedown', (e) => {
  if (!locked()) return;
  e.stopPropagation();
  e.preventDefault();
  buttons |= 1 << e.button;
  // Send the movement that is already waiting, then the press on its own, so
  // it cannot sit behind a frame's worth of queued motion.
  flushMouse();
  sendButtons();
}, true);

window.addEventListener('mouseup', (e) => {
  if (!locked()) return;
  e.stopPropagation();
  e.preventDefault();
  buttons &= ~(1 << e.button);
  flushMouse();
  sendButtons();
}, true);

window.addEventListener('contextmenu', (e) => {
  if (locked()) e.preventDefault();
});

status('Connecting…');
</script>
</body>
</html>
